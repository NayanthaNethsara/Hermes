[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "archivist-backend"
version = "0.1.0"
description = "The Archivist - AI Research Assistant Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.0.0",
    "chromadb>=0.4.0",
    "networkx>=3.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "python-telegram-bot>=21.0",
    "pytesseract>=0.3.10",
    "pypdf>=4.0.0",
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []
